name: Build OpenWrt IPK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt x86_64
            sdk_arch: x86_64
            goarch: amd64
            artifact: bagualu-openwrt-x86_64
          - name: OpenWrt ARM64
            sdk_arch: aarch64_cortex-a53
            goarch: arm64
            artifact: bagualu-openwrt-aarch64-cortex-a53
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix web/admin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Resolve package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use v<major>.<minor>.<patch>: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG_RELEASE=1" >> "$GITHUB_ENV"

      - name: Verify SDD
        run: ./scripts/verify-sdd.sh

      - name: Build static Bagualu binary
        env:
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p .openwrt
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" GOMIPS="$GOMIPS" \
            go build -trimpath -ldflags "-s -w" -o .openwrt/bagualu ./cmd/bagualu
          file .openwrt/bagualu

      - name: Stage OpenWrt package feed
        run: |
          cp -a packaging/openwrt bagualu
          cp .openwrt/bagualu bagualu/bagualu
          sed -i "s/^PKG_VERSION?=.*/PKG_VERSION:=${PKG_VERSION}/" bagualu/Makefile
          sed -i "s/^PKG_RELEASE?=.*/PKG_RELEASE:=${PKG_RELEASE}/" bagualu/Makefile
          test -x bagualu/bagualu
          test -f bagualu/Makefile
          test "$(grep -c '^PKG_VERSION:=' bagualu/Makefile)" -eq 1
          test "$(grep -c '^PKG_RELEASE:=' bagualu/Makefile)" -eq 1
          find bagualu -maxdepth 2 -type f -print | sort

      - name: Build package with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.sdk_arch }}
          PACKAGES: bagualu
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1

      - name: Collect package metadata
        run: |
          mkdir -p artifact
          find bin/packages -type f \( -name '*.ipk' -o -name 'Packages*' \) -exec cp --parents {} artifact/ \;
          test -n "$(find artifact -name '*.ipk' -print -quit)"
          cp docs/openwrt-install.md artifact/

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: bagualu-openwrt-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.ipk' -o -name 'openwrt-install.md' \) -print)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "八卦炉 $GITHUB_REF_NAME" \
              --generate-notes
          fi
