name: Build OpenWrt IPK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt x86_64
            sdk_arch: x86_64
            goarch: amd64
            artifact: bagualu-openwrt-x86_64
          - name: OpenWrt ARM64
            sdk_arch: aarch64_cortex-a53
            goarch: arm64
            artifact: bagualu-openwrt-aarch64-cortex-a53
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix web/admin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Resolve package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use v<major>.<minor>.<patch>: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG_RELEASE=1" >> "$GITHUB_ENV"

      - name: Verify SDD
        run: ./scripts/verify-sdd.sh

      - name: Build static Bagualu binary
        env:
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p .openwrt
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" GOMIPS="$GOMIPS" \
            go build -trimpath -ldflags "-s -w" -o .openwrt/bagualu ./cmd/bagualu
          file .openwrt/bagualu

      - name: Build OpenWrt IPK
        run: |
          ./scripts/build-openwrt-ipk.sh \
            --binary .openwrt/bagualu \
            --package-dir packaging/openwrt \
            --version "$PKG_VERSION" \
            --release "$PKG_RELEASE" \
            --architecture "${{ matrix.sdk_arch }}" \
            --output-dir bin/packages/${{ matrix.sdk_arch }}/bagualu
          file bin/packages/${{ matrix.sdk_arch }}/bagualu/*.ipk

      - name: Collect package metadata
        run: |
          mkdir -p artifact
          find bin/packages -type f \( -name '*.ipk' -o -name 'Packages*' \) -exec cp --parents {} artifact/ \;
          test -n "$(find artifact -name '*.ipk' -print -quit)"
          cp docs/openwrt-install.md artifact/

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: bagualu-openwrt-*
          merge-multiple: true
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets/publish
          find release-assets -type f -name '*.ipk' -exec cp {} release-assets/publish/ \;
          install_doc=$(find release-assets -type f -name 'openwrt-install.md' -print -quit)
          if [[ -n "$install_doc" ]]; then
            cp "$install_doc" release-assets/publish/openwrt-install.md
          fi
          test -n "$(find release-assets/publish -type f -name '*.ipk' -print -quit)"
          find release-assets/publish -maxdepth 1 -type f -print | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 八卦炉 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/publish/*.ipk
            release-assets/publish/openwrt-install.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
